# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the Lily58 OLED Display
# CONFIG_ZMK_DISPLAY=y

# Enable the WS2812 RGB LED Chain
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Sets the default starting brightness for RGB (0-100)
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=60

# Select the default startup effect
# 0 = Solid, 1 = Breathe, 2 = Spectrum (Flowing left-to-right), 3 = Swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2

# Optional battery optimization (Highly recommended for wireless nice!nanos)
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
